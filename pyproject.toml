[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. The import package and CLI command stay `niva`
# (see [tool.hatch...] packages + [project.scripts]) — like scikit-learn → sklearn.
name = "qgis_niva"
version = "0.63.4"
description = "A concise, readable text-pipeline grammar for QGIS geoprocessing."
readme = "README.md"
requires-python = ">=3.12"  # QGIS 4.x ships Python 3.12 (OSGeo4W / system); niva runs in QGIS's own interpreter
license = "GPL-3.0-or-later"
authors = [{ name = "John Zastrow" }]
keywords = ["qgis", "gis", "geoprocessing", "pyqgis", "dsl", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
# Near-zero dependencies by design (see docs/planning/Oscar_the_Grouch.md E1): QGIS and
# its stack are provided by the host interpreter, never bundled by niva.
dependencies = []

# The test suite is stdlib `unittest` so it runs in QGIS's own Python with zero
# install (that's where CI runs it). `pytest` is an *optional* convenience — it
# runs the same unittest-style tests — for anyone who prefers it.
[project.optional-dependencies]
dev = ["pytest", "ruff"]
# The rich terminal layer (opt-in, docs/planning/20 §4): powers `niva repl` and
# `niva studio`. The core CLI stays zero-dependency and degrades gracefully
# without these — they only upgrade the experience.
cli = ["prompt_toolkit>=3.0", "rich>=13.0", "textual>=0.60"]

[project.urls]
Homepage = "https://github.com/johnzastrow/niva"
Source = "https://github.com/johnzastrow/niva"

[project.scripts]
niva = "niva.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["niva"]

# ty (type checker, CI-gated; pinned in .github/workflows/ci.yml). QGIS/PyQt are not installed in
# the lint job — they come from QGIS's own Python at run time — so their imports are allowed to be
# unresolved (ty then treats those names as Unknown rather than reporting every use).
[tool.ty.analysis]
# Optional extras (prompt_toolkit: REPL; pptx: slide builder; numpy: one raster test) and
# QGIS-only modules (pyplugin_installer) are likewise absent from the lint job.
allowed-unresolved-imports = [
    "qgis.**", "PyQt5.**", "PyQt6.**", "processing.**", "osgeo.**",
    "pyplugin_installer", "prompt_toolkit.**", "pptx.**", "numpy.**",
]

[tool.ty.environment]
# niva runs on Windows, macOS and Linux: check platform-specific code (winreg, ctypes.windll)
# against every platform, not just the CI runner's.
python-platform = "all"

# Tests replace functions and classes with fakes on purpose (monkeypatching).
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

# Shipped code (niva/, plugin/) is gated at error level. Tests, scripts and docs tooling report
# the looser findings (mostly Optional narrowing in fixtures) as warnings: visible, not blocking.
[[tool.ty.overrides]]
include = ["tests/**", "scripts/**", "docs/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "warn"
invalid-argument-type = "warn"
not-subscriptable = "warn"
no-matching-overload = "warn"
