<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'DejaVu Sans','Arial',sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- source: niva analysis product -->
  <rect x="420" y="36" width="360" height="96" rx="14" fill="#465753"/>
  <text x="600" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">One niva analysis product</text>
  <text x="600" y="108" text-anchor="middle" font-size="16" fill="#cfe0d0">reproducible · provenance-tracked · current</text>

  <!-- connectors to 3 destinations -->
  <g stroke="#8d998b" stroke-width="2.5" fill="none">
    <path d="M600 132 V168 H210 V196"/>
    <path d="M600 168 V196"/>
    <path d="M600 132 V168 H990 V196"/>
  </g>

  <!-- 3 destination cards -->
  <g text-anchor="middle">
    <!-- QGIS -->
    <rect x="60"  y="198" width="300" height="250" rx="12" fill="#eef1ec" stroke="#465753" stroke-width="1.5"/>
    <text x="210" y="244" font-size="23" font-weight="700" fill="#28323b">QGIS</text>
    <text x="210" y="276" font-size="17" fill="#465753">desktop GIS</text>
    <text x="210" y="314" font-size="16" fill="#28323b">pan, zoom, re-style,</text>
    <text x="210" y="338" font-size="16" fill="#28323b">dig into every feature</text>
    <line x1="100" y1="368" x2="320" y2="368" stroke="#cdd6cc"/>
    <text x="210" y="404" font-size="15" font-style="italic" fill="#6B7B6F">for GIS analysts &amp;</text>
    <text x="210" y="424" font-size="15" font-style="italic" fill="#6B7B6F">power users</text>

    <!-- Marimo -->
    <rect x="450" y="198" width="300" height="250" rx="12" fill="#f3efe6" stroke="#c1b49b" stroke-width="3"/>
    <text x="600" y="244" font-size="23" font-weight="700" fill="#7d6f50">Marimo</text>
    <text x="600" y="276" font-size="17" fill="#7d6f50">interactive notebooks</text>
    <text x="600" y="314" font-size="16" fill="#28323b">reactive widgets, tables,</text>
    <text x="600" y="338" font-size="16" fill="#28323b">maps &amp; charts — live</text>
    <line x1="490" y1="368" x2="710" y2="368" stroke="#e0d6c4"/>
    <text x="600" y="404" font-size="15" font-style="italic" fill="#8d7c5c">for data scientists &amp;</text>
    <text x="600" y="424" font-size="15" font-style="italic" fill="#8d7c5c">collaborators</text>

    <!-- Static files -->
    <rect x="840" y="198" width="300" height="250" rx="12" fill="#eef1ec" stroke="#465753" stroke-width="1.5"/>
    <text x="990" y="244" font-size="23" font-weight="700" fill="#28323b">Static files</text>
    <text x="990" y="276" font-size="17" fill="#465753">HTML · PDF · GeoPackage</text>
    <text x="990" y="314" font-size="16" fill="#28323b">open anywhere,</text>
    <text x="990" y="338" font-size="16" fill="#28323b">no install, no GIS</text>
    <line x1="880" y1="368" x2="1100" y2="368" stroke="#cdd6cc"/>
    <text x="990" y="404" font-size="15" font-style="italic" fill="#6B7B6F">for execs, clients &amp;</text>
    <text x="990" y="424" font-size="15" font-style="italic" fill="#6B7B6F">the public</text>
  </g>

  <text x="600" y="500" text-anchor="middle" font-size="20" fill="#28323b">Produce once — <tspan font-weight="700" fill="#465753">everyone explores it the way that suits them</tspan>.</text>
</svg>
