name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in CI needs to write to the repo. A compromised step
# (or action) therefore can't push code, open releases, or mint tokens.
permissions:
  contents: read

jobs:
  unit:
    name: unit tests (no QGIS — PyQGIS smoke tests skip)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # niva has zero runtime dependencies; the pure-Python layers (grammar,
      # registry, binder, engine over MockBackend) run on a plain interpreter.
      # The PyQGIS smoke tests skip cleanly when qgis is unimportable.
      - name: Run the unit suite
        run: python -m unittest discover -s tests -t .

  test-companions:
    name: test & example companions are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.3.0
        with:
          python-version: "3.12"
      # Project rule: every test add/change regenerates its companion. Two generators:
      #   tests/niva/*.niva       — what each unittest exercises (gen_test_niva.py)
      #   tests/suites/*.run.niva     — pure-runnable validation suites (gen_run_niva.py)
      # Regenerate both and fail if anything drifted — so a PR can't merge stale companions.
      - name: Regenerate companions and check for drift
        run: |
          python scripts/gen_test_niva.py
          python scripts/gen_run_niva.py
          git diff --exit-code -- tests/niva tests/suites/*.run.niva \
            || { echo "::error::companions are stale — run: python scripts/gen_test_niva.py && python scripts/gen_run_niva.py"; exit 1; }

  qgis:
    name: live-QGIS + PostGIS tests (real backend)
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:stable
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: niva
          POSTGRES_PASSWORD: niva
          POSTGRES_DB: niva
        options: >-
          --health-cmd "pg_isready -U niva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QT_QPA_PLATFORM: offscreen
      # The job runs in a container, so the service is reachable by its label hostname.
      NIVA_TEST_PG: "host=postgres port=5432 dbname=niva user=niva password=niva"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: QGIS version
        run: python3 -c "from qgis.core import Qgis; print('QGIS', Qgis.QGIS_VERSION)"
      # The PyQGIS tier exercises the real backend (GeoPackage, SpatiaLite, PostGIS, and
      # QgsProject repointing) — the layer the pure-Python suite cannot reach. The PostGIS
      # tests run against the service above; the rest use files / SpatiaLite.
      # NOTE: headless QGIS can segfault during interpreter teardown *after* the tests
      # pass (exit 139), so we gate on unittest's OK/FAILED marker, not the exit code.
      - name: Run the live-QGIS + PostGIS suite
        run: |
          python3 -m unittest tests.test_pyqgis -v 2>&1 | tee /tmp/qgis-tests.log || true
          grep -qE '^OK' /tmp/qgis-tests.log

  lint:
    name: lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.3.0
        with:
          python-version: "3.12"
      # Pin ruff EXACTLY: `format --check` is byte-for-byte, so a different ruff can
      # reformat differently and fail. Bump this pin and reformat in the same commit.
      - run: python -m pip install "ruff==0.15.19"
      - name: ruff check (lint)
        run: ruff check .
      - name: ruff format (enforce — no drift)
        run: ruff format --check --diff .

  security:
    name: security scan (bandit + detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.3.0
        with:
          python-version: "3.12"
      # The SAME tools plugins.qgis.org runs — so main is always plugin-repo-clean and
      # any version we cut passes the store's scan. Bandit gates on MEDIUM+ (the store's
      # blocking threshold); LOW findings (best-effort try/except, the shell=False PDAL/SAGA
      # subprocess harness) are intentional and don't block. See docs/guide/qgis-plugin-publishing.md.
      - run: python -m pip install "bandit==1.9.4" "detect-secrets==1.5.0"
      - name: Bandit (fail on MEDIUM+ severity)
        run: bandit -r niva plugin --severity-level medium
      - name: detect-secrets (no hardcoded secrets)
        run: |
          detect-secrets scan niva plugin > ds-report.json
          python - <<'PY'
          import json, sys
          results = json.load(open("ds-report.json")).get("results", {})
          n = sum(len(v) for v in results.values())
          print(f"detect-secrets: {n} potential secret(s)")
          if n:
              for path, items in results.items():
                  for it in items:
                      print(f"  {path}:{it.get('line_number')} {it.get('type')}")
              sys.exit(1)
          PY

  build:
    name: build wheel + smoke-test the install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Install the wheel and exercise the CLI (no QGIS)
        run: |
          pip install dist/*.whl
          cd /tmp
          niva --help
          niva describe buffer
          niva "load a.gpkg | buffer 100m dissolve | save b.gpkg" --dry-run
