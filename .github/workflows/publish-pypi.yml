name: Publish to PyPI

# Publishes the `qgis-niva` distribution to PyPI on a GitHub Release.
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# One-time setup on PyPI: Account → Publishing → add a GitHub trusted publisher
#   owner: johnzastrow   repo: niva   workflow: publish-pypi.yml   environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish (Trusted Publishing)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC / Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
